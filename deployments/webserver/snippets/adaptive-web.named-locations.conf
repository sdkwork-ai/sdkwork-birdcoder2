# Named locations for Adaptive Web (SDKWORK_DEPLOY_SPEC.md §8.1).
# Installed package roots; checkout dev uses gateway proxy on non-production hosts.

location @pc {
    root /usr/share/sdkwork/birdcoder2/web/pc;
    index index.html;
    try_files $uri $uri/ /index.html;
}

location @h5 {
    root /usr/share/sdkwork/birdcoder2/web/h5;
    index index.html;
    try_files $uri $uri/ /index.html;
}
