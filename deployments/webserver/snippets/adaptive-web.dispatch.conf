# location / dispatch for Adaptive Web (SDKWORK_DEPLOY_SPEC.md §8.1).
# Map $sdkwork_webserver_surface_final → pc|h5 is defined in adaptive-web.maps.conf.
# Stock nginx: jump to named location @$surface_final (never variable include).
try_files /__sdkwork_adaptive_dispatch__ @$sdkwork_webserver_surface_final;
add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
