# Adaptive PC/H5 surface selection (SDKWORK_DEPLOY_SPEC.md §8).
# REFERENCE ONLY for modules with expose.mode web / web+api.
# Do NOT include on sdkwork-webserver product edge (expose.mode: api);
# that edge reverse-proxies to the process AdaptiveAppShell.
# Mobile prefers h5; desktop prefers pc. Client-Hint Sec-CH-UA-Mobile=?1 forces h5.
# iPad before the mobile regex: iPad UAs often contain "Mobile" but default to pc.
map $http_user_agent $sdkwork_webserver_surface {
    "~*iPad" pc;
    "~*(Mobile|Android|iPhone|iPod|webOS|BlackBerry|IEMobile|Opera Mini|MicroMessenger|HuaweiBrowser|HarmonyOS|UCBrowser|Quark)" h5;
    default pc;
}

map $http_sec_ch_ua_mobile $sdkwork_webserver_mobile_ch {
    default "";
    "?1" "1";
}

map $sdkwork_webserver_mobile_ch $sdkwork_webserver_surface_final {
    default $sdkwork_webserver_surface;
    "1" h5;
}
