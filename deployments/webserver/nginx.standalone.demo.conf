# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/birdcoder2/webserver.pid;
error_log /var/log/sdkwork/birdcoder2/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:4080;
    }
    server {
        listen 80;
        server_name birdcoder2-demo.sdkwork.com birdcoder2-demo.birdcoder.com birdcoder2-demo.dtupay.com birdcoder2-demo.noaper.com birdcoder2-demo.sdkwork.cn birdcoder2-demo.birdcoder.cn birdcoder2-demo.dtupay.cn birdcoder2-demo.noaper.cn birdcoder2-demo.skubc.com birdcoder2-demo.skubc.cn birdcoder2-demo.zowalk.com birdcoder2-demo.zowalk.cn birdcoder2-demo.offer86.com birdcoder2-demo.offer86.cn birdcoder2-demo.86offer.com birdcoder2-demo.86offer.cn harness-demo.sdkwork.com;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/birdcoder2/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
