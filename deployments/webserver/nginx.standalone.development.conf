# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/birdcoder2/webserver.pid;
error_log /var/log/sdkwork/birdcoder2/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:4080;
    }
    server {
        listen 80;
        server_name birdcoder2-dev.sdkwork.com birdcoder2-dev.birdcoder.com birdcoder2-dev.dtupay.com birdcoder2-dev.sdkwork.cn birdcoder2-dev.birdcoder.cn birdcoder2-dev.dtupay.cn birdcoder2-dev.skubc.com birdcoder2-dev.skubc.cn birdcoder2-dev.zowalk.com birdcoder2-dev.zowalk.cn birdcoder2-dev.offer86.com birdcoder2-dev.offer86.cn birdcoder2-dev.86offer.com birdcoder2-dev.86offer.cn harness-dev.sdkwork.com;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
