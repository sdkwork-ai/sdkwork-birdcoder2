apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-config
data:
  DSH_HOME: /data
  DSH_WEB_HOST: 0.0.0.0
  # Container deployments use 4080; npx/dsh web remains on 3080.
  DSH_WEB_PORT: "4080"
  DSH_ALLOW_NON_LOOPBACK: "1"
  # Replace this with the public Ingress host (and port when non-standard).
  DSH_TRUSTED_HOSTS: dsh.default.svc.cluster.local
  DSH_TELEMETRY_DISABLED: "1"
  DSH_PERMISSION_MODE: workspace-write
