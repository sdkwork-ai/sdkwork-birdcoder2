# Stateless high-availability overlay for SDKWork BirdCoder.
# Apply with values.yaml after provisioning OpenTelemetry.
#
# The gateway is stateless: its bounded synchronization refresh cache and
# in-flight registry live in process memory, so horizontal scaling is safe
# without any external realtime store. Redis-backed realtime is not
# implemented and is deliberately not advertised here.

replicaCount: 3

# Required pod anti-affinity plus a host-level topology spread: with three or
# more replicas the gateway must land on distinct nodes so a single-node loss
# never takes down the whole HA fleet (the base values only prefer it).
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - sdkwork-birdcoder2
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: sdkwork-birdcoder2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

observability:
  logLevel: info
  tracesExporter: otlp
  otlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  otlpProtocol: grpc
  metricsExporter: prometheus
  logsExporter: otlp
  tracesSamplingRatio: "0.1"

resources:
  limits:
    cpu: "4"
    memory: 8Gi
  requests:
    cpu: "1"
    memory: 1Gi
