# Optional NGINX example. Create dsh-basic-auth with an htpasswd-formatted
# `auth` key and provide dsh-tls before applying this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsh
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: dsh-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: Authentication Required
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dsh.example.com
      secretName: dsh-tls
  rules:
    - host: dsh.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsh
                port:
                  name: http
