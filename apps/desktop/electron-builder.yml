# electron-builder configuration for the BirdCoder desktop shell.
# Icons are generated from the product icon (assets/birdcoder2-appicon.png)
# by `pnpm --filter @deepseek-ai/dsh-desktop run generate-icons` into build/.
# asar is OFF: the harness host heals its per-profile module fallback with
# junctions/symlinks that must point at REAL directories, and an asar archive
# is a file, not a directory — an asar-layout profile boot would fail to
# resolve its plugins. The packaged layout is resources/app/ as real files.
appId: com.sdkwork.birdcoder
productName: BirdCoder
copyright: Copyright (c) 2026 SDKWork AI
# The package name is scoped (@deepseek-ai/dsh-desktop), which electron-builder
# cannot turn into a safe executable name (Linux rejects the @ and / with
# "executableName contains characters that cannot be safely used in file
# paths"). Pin a plain name so every platform's binary and installer are stable.
executableName: birdcoder
artifactName: 'BirdCoder-${version}-${os}-${arch}.${ext}'
# Update source for the desktop shell's auto-updater (apps/desktop/src/update.ts):
# electron-updater reads the GitHub Releases provider embedded in
# resources/app-update.yml and resolves updates from this repo's releases. The
# provider is spelled out because the package.json `repository` field points at
# the upstream harness repo, not this repo's git remote. Packing with this
# section configured writes latest.yml / latest-mac.yml / latest-linux.yml
# beside the installers; uploads stay manual (the release workflow has no
# GH_TOKEN by design), so the release job carries the metadata files to the
# GitHub Release alongside the installers.
publish:
  provider: github
  owner: sdkwork-ai
  repo: sdkwork-birdcoder2
directories:
  output: release
  buildResources: build
files:
  - lib/**/*
  - build/icon.png
  - config/agent-presets/**/*
  # Workspace links expose each package's development sources and compiler
  # metadata to electron-builder. They are not reachable from the published
  # lib entry points, but account for thousands of files and make NSIS spend
  # most of its install time creating and scanning needless files.
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.mts'
  - '!**/*.cts'
  - '!**/*.tsbuildinfo'
  - '!src/**'
  - '!tests/**'
  - '!tsconfig*.json'
  - '!electron-builder.yml'
  - '!release/**'
asar: false
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Direct ZIP extraction avoids the temporary-directory copy used by the
  # differential 7z payload. The updater consumes the full installer (the
  # differential payload is a download-size optimization deferred with the
  # signed-update milestone); installer speed remains the useful trade-off.
  differentialPackage: false
  useZip: true
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
linux:
  icon: build/icon.png
  category: Development
  synopsis: Desktop agent harness
  maintainer: SDKWork AI <support@sdkwork.com>
  vendor: SDKWork AI
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  # Package metadata must use a filesystem-safe token; the branded productName
  # remains the application name shown by the desktop shell.
  packageName: birdcoder
rpm:
  packageName: birdcoder
# The static AppImage toolset carries native runtimes for every target
# architecture. The legacy FUSE2 toolset falls back to an x64 runtime on arm64.
toolsets:
  appimage: '1.0.3'
electronLanguages:
  - en-US
  - zh-CN
npmRebuild: false
