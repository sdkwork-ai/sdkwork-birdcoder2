# Experimental Schedule over the shipped Web composition, which carries none of
# these rows. The Schedule service owns the task store and delivers each due
# occurrence as a follow-up in its original Session; `time-context` supplies the
# current time, browser zone, and elapsed time the model needs to resolve an
# unqualified date or time; `ui-schedule` is the task page and the Session
# reminder catalog over that service.

- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'
      # FORK DIVERGENCE: the fork's Automation mode page (`ui-sdkwork-automation`)
      # is the product's task surface, so upstream's page is composed only while
      # that replacement is switched off. Both rows stay in the composition and a
      # profile switch can never render two task pages at once.
      disabled: !!js "!ctx.get('loader') || [...ctx.get('loader').entries()].some(entry => entry.options.id === 'ui-sdkwork-automation' && !entry.disabled)"
