# Reusable and manual-only native Desktop packaging. A birdcoder-v* publication
# calls this workflow from container-release.yml so one tag creates one GitHub Release.
name: Desktop package matrix

on:
  workflow_call:
    inputs:
      version:
        description: Version that every Desktop package must carry
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Optional expected version; defaults to package.json
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  package:
    name: Package ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            artifact: dsh-desktop-windows-x64
            builder-args: --win --x64
            release-files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            app-dir: release/win-unpacked/resources/app
            smoke-cmd: pnpm --filter @deepseek-ai/dsh-desktop exec electron scripts/packaged-boot-probe.cjs
          - name: windows-arm64
            os: windows-11-arm
            artifact: dsh-desktop-windows-arm64
            builder-args: --win --arm64
            release-files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            app-dir: release/win-arm64-unpacked/resources/app
            smoke-cmd: pnpm --filter @deepseek-ai/dsh-desktop exec electron scripts/packaged-boot-probe.cjs
          - name: macos-x64
            os: macos-15-intel
            artifact: dsh-desktop-macos-x64
            builder-args: --mac --x64
            release-files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            app-dir: release/mac/birdcoder.app/Contents/Resources/app
            smoke-cmd: pnpm --filter @deepseek-ai/dsh-desktop exec electron scripts/packaged-boot-probe.cjs
          - name: macos-arm64
            os: macos-15
            artifact: dsh-desktop-macos-arm64
            builder-args: --mac --arm64
            release-files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            app-dir: release/mac-arm64/birdcoder.app/Contents/Resources/app
            smoke-cmd: pnpm --filter @deepseek-ai/dsh-desktop exec electron scripts/packaged-boot-probe.cjs
          - name: linux-x64
            os: ubuntu-24.04
            artifact: dsh-desktop-linux-x64
            builder-args: --linux --x64
            release-files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/*.tar.gz
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            app-dir: release/linux-unpacked/resources/app
            smoke-cmd: xvfb-run -a pnpm --filter @deepseek-ai/dsh-desktop exec electron scripts/packaged-boot-probe.cjs
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: dsh-desktop-linux-arm64
            builder-args: --linux --arm64
            release-files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/*.tar.gz
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            app-dir: release/linux-arm64-unpacked/resources/app
            smoke-cmd: xvfb-run -a pnpm --filter @deepseek-ai/dsh-desktop exec electron scripts/packaged-boot-probe.cjs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate package version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./package.json').version")"
          if [[ -n "$EXPECTED_VERSION" && "$EXPECTED_VERSION" != "$manifest_version" ]]; then
            echo "desktop version $manifest_version does not match requested version $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Check packaged dependency closure
        run: pnpm --filter @deepseek-ai/dsh-desktop run check:pack-deps

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build desktop shell
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Pack installers and update metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --publish never ${{ matrix.builder-args }}

      - name: Smoke packaged boot
        run: ${{ matrix.smoke-cmd }} "${{ matrix.app-dir }}" --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.release-files }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
