# Reusable and manual-only native Desktop packaging. A birdcoder-v* publication
# calls this workflow from container-release.yml so one tag creates one GitHub
# Release.
#
# Each target is its own job calling `desktop-package-target.yml`, so the run
# summary names the target that failed and a retry re-runs only that job. The
# table below is the single target coverage; `resolve` validates the optional
# `targets` selection against it, which is how one target is repackaged from
# `workflow_dispatch` without touching the other five ([lane
# decision](../../.agents/notes/implemented/process/2026-11-02-desktop-release-per-target-lanes.md)).
name: Desktop package lanes

on:
  workflow_call:
    inputs:
      version:
        description: Version that every Desktop package must carry
        required: true
        type: string
      targets:
        description: Comma-separated targets to package, or `all`; a partial run cannot publish the GitHub Release
        required: false
        type: string
        default: all
    secrets:
      # Every target clones the pinned SDKWork siblings before packaging. A
      # reusable workflow receives no secrets unless the caller names them, so
      # the contract is declared here instead of being left to `inherit`.
      SDKWORK_GITHUB_TOKEN:
        description: GitHub token with read access to every sdkwork-* repository.
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Optional expected version; defaults to package.json
        required: false
        type: string
      targets:
        description: '打包目标：all 或逗号分隔的 mac-arm64、mac-x64、win-x64、win-arm64、linux-x64、linux-arm64；只打包部分目标时不能发布 GitHub Release'
        required: false
        type: string
        default: all

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve version and targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.selection.outputs.version }}
      targets: ${{ steps.selection.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and validate the target selection
        id: selection
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: node apps/desktop/scripts/resolve-desktop-release-selection.mjs

      # The tag release needs all six targets: `assemble-github-release.ts`
      # rejects a missing or extra asset, so a partial run is a repackaging and
      # diagnosis tool, not a publication path.
      - name: Report a partial packaging run
        if: steps.selection.outputs.partial == 'true'
        run: echo "::warning::Packaging ${{ steps.selection.outputs.targets }} only; the GitHub Release requires all six targets"

  # The artifact names, the target names, and the output directories all come
  # from `assemble-github-release.ts` and `desktop-build-paths.mjs`. Windows arm64
  # and both Linux architectures exist only in the fork — the fork publishes a
  # six-target Release where upstream packages three.
  #
  # env-file names the platform release settings the win/mac packaging preflight
  # requires even for `--unsigned` runs (application identity and the
  # mandatory-update policy). The lane materializes the template defaults; the
  # signing fields stay empty because the unsigned lane skips every credential
  # check.
  #
  # build-root overrides `desktop-build-paths.mjs` for the Windows lanes only.
  # The packaged Windows Office engine opens `program/share/**` through plain
  # Win32 calls, which stop at MAX_PATH, so its own absolute path must stay short
  # enough for its deepest shipped file: the engine root measures 136 characters
  # on these lanes and its deepest resource
  # (`program/share/config/soffice.cfg/modules/simpress/popupmenu/pagepanecanvasmaster.xml`,
  # 84 characters) lands at 221, which converts. The checkout default is already
  # 195 characters locally and 202 on a runner, and those fail with an opaque
  # `Unknown LibreOfficeKit exception`. That default is not marginal: the build
  # root resolves to 63 characters on a developer machine and 70 inside the
  # runner's workspace, while a directory at a drive root resolves to 4. The root
  # also has to sit on a drive the image actually has, and the two Windows images
  # disagree: `windows-2025` keeps its work folder on `D:` and uses `D:/b`, while
  # `windows-11-arm` has no `D:` at all — run 35998447512 died there on
  # `ENOENT: no such file or directory, mkdir 'D:\b\targets\win-arm64\packed\dsh'`
  # — and uses `C:/b`, the drive its own workspace already lives on. Both are 4
  # characters, so the depth bought is identical on both lanes. macOS and Linux
  # have no such limit, so their lanes leave this blank and keep the checkout
  # default. `smoke-packaged-runtime.ts` measures the packaged tree on every run,
  # so future drift fails there instead of inside a conversion.
  package-win-x64:
    name: Package win-x64
    needs: resolve
    if: contains(format(',{0},', needs.resolve.outputs.targets), ',win-x64,')
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      target: win-x64
      runner: windows-2025
      artifact: dsh-desktop-windows-x64
      script: package:win:x64:unsigned
      build-root: D:/b
      artifacts-dir: D:/b/targets/win-x64/unsigned-artifacts
      env-file: packaging/windows.env
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  package-win-arm64:
    name: Package win-arm64
    needs: resolve
    if: contains(format(',{0},', needs.resolve.outputs.targets), ',win-arm64,')
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      target: win-arm64
      runner: windows-11-arm
      artifact: dsh-desktop-windows-arm64
      script: package:win:arm64:unsigned
      build-root: C:/b
      artifacts-dir: C:/b/targets/win-arm64/unsigned-artifacts
      env-file: packaging/windows.env
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  package-mac-x64:
    name: Package mac-x64
    needs: resolve
    if: contains(format(',{0},', needs.resolve.outputs.targets), ',mac-x64,')
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      target: mac-x64
      runner: macos-15-intel
      artifact: dsh-desktop-macos-x64
      script: package:mac:x64:unsigned
      artifacts-dir: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts
      env-file: packaging/macos.env
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  package-mac-arm64:
    name: Package mac-arm64
    needs: resolve
    if: contains(format(',{0},', needs.resolve.outputs.targets), ',mac-arm64,')
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      target: mac-arm64
      runner: macos-15
      artifact: dsh-desktop-macos-arm64
      script: package:mac:arm64:unsigned
      artifacts-dir: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts
      env-file: packaging/macos.env
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  package-linux-x64:
    name: Package linux-x64
    needs: resolve
    if: contains(format(',{0},', needs.resolve.outputs.targets), ',linux-x64,')
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      target: linux-x64
      runner: ubuntu-24.04
      artifact: dsh-desktop-linux-x64
      script: package:linux:x64:unsigned
      artifacts-dir: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  package-linux-arm64:
    name: Package linux-arm64
    needs: resolve
    if: contains(format(',{0},', needs.resolve.outputs.targets), ',linux-arm64,')
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      target: linux-arm64
      runner: ubuntu-24.04-arm
      artifact: dsh-desktop-linux-arm64
      script: package:linux:arm64:unsigned
      artifacts-dir: apps/desktop/.desktop-build/targets/linux-arm64/unsigned-artifacts
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
