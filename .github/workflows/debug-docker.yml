name: Debug docker build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo
          persist-credentials: false

      - name: Clone SDKWork ecosystem siblings
        uses: ./repo/.github/actions/setup-sdkwork-siblings
        with:
          token: ${{ secrets.SDKWORK_GITHUB_TOKEN }}
          target-dir: ${{ github.workspace }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        working-directory: repo
        run: pnpm run build

      - name: Prepare prebuilt context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilt
          cp -r repo prebuilt
          rm -f prebuilt/.dockerignore

      - uses: docker/setup-buildx-action@v3

      - name: Build image with prebuilt context
        uses: docker/build-push-action@v7
        with:
          context: ./repo
          file: repo/Dockerfile.debug
          build-contexts: |
            sdkwork-ecosystem=${{ github.workspace }}
            prebuilt=${{ github.workspace }}/prebuilt
          load: true
          tags: localhost/debug-harness:0.1.0-rc.14
