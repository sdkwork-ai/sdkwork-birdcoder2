name: Debug docker build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  SDKWORK_GITHUB_TOKEN: ${{ secrets.SDKWORK_GITHUB_TOKEN }}

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo
          persist-credentials: false

      - name: Clone SDKWork ecosystem siblings
        if: ${{ env.SDKWORK_GITHUB_TOKEN != '' }}
        uses: ./repo/.github/actions/setup-sdkwork-siblings
        with:
          token: ${{ secrets.SDKWORK_GITHUB_TOKEN }}
          target-dir: ${{ github.workspace }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image with debug install
        uses: docker/build-push-action@v6
        with:
          context: ./repo
          file: repo/Dockerfile.debug
          build-contexts: |
            sdkwork-ecosystem=${{ github.workspace }}
          load: true
          tags: localhost/debug-harness:0.1.0-rc.14
