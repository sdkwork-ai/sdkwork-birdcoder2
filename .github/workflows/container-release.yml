# One birdcoder-v* tag packages every Desktop target, two native container
# images, and the Compose/Kubernetes bundle, then publishes their exact asset
# set in one GitHub Release. Container images remain offline Docker archives.
name: Release (dsh artifacts)

on:
  push:
    tags: ['birdcoder-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version to rehearse (use the package.json version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag and package version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#birdcoder-v}"
            test "$GITHUB_REF_NAME" = "birdcoder-v$version"
          else
            version="$DISPATCH_VERSION"
          fi
          manifest_version="$(node -p "require('./package.json').version")"
          test "$version" = "$manifest_version" || {
            echo "release version $version does not match package.json $manifest_version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop:
    name: Package Desktop matrix
    needs: resolve
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    permissions:
      contents: read

  container-bundle:
    name: Package Compose and Kubernetes bundle
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify deployment and release definitions
        run: pnpm run verify:container

      - name: Package deployment assets
        run: pnpm run release:pack-container --out dist/container --image-repository localhost/deepseek-harness

      - name: Verify packaged deployment archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          archive="birdcoder-container-${RELEASE_VERSION}.tar.gz"
          (
            cd dist/container
            sha256sum --check "$archive.sha256"
          )
          rm -rf dist/container/verified
          mkdir -p dist/container/verified
          tar -xzf "dist/container/$archive" -C dist/container/verified
          pnpm run release:verify-container-bundle \
            --root "dist/container/verified/birdcoder-container-${RELEASE_VERSION}" \
            --version "$RELEASE_VERSION" \
            --image "localhost/deepseek-harness:${RELEASE_VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: birdcoder-container-deployment-${{ needs.resolve.outputs.version }}
          path: |
            dist/container/birdcoder-container-${{ needs.resolve.outputs.version }}.tar.gz
            dist/container/birdcoder-container-${{ needs.resolve.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  container-image:
    name: Package container ${{ matrix.platform }}
    needs: [resolve, container-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: birdcoder-container-deployment-${{ needs.resolve.outputs.version }}
          path: dist/container

      - name: Verify and extract deployment archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          archive="birdcoder-container-${RELEASE_VERSION}.tar.gz"
          (
            cd dist/container
            sha256sum --check "$archive.sha256"
          )
          mkdir -p dist/container/extracted
          tar -xzf "dist/container/$archive" -C dist/container/extracted

      - uses: docker/setup-buildx-action@v3

      - name: Build native image without registry publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: localhost/deepseek-harness:${{ needs.resolve.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max

      - name: Save and reload offline image
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          filename="birdcoder-container-image-${RELEASE_VERSION}-linux-${RELEASE_ARCH}.tar.gz"
          docker save "localhost/deepseek-harness:${RELEASE_VERSION}" | gzip -n > "dist/container/$filename"
          (
            cd dist/container
            sha256sum "$filename" > "$filename.sha256"
            sha256sum --check "$filename.sha256"
          )
          docker image rm "localhost/deepseek-harness:${RELEASE_VERSION}"
          gzip -dc "dist/container/$filename" | docker load

      - name: Smoke reloaded image and deployment package
        shell: bash
        env:
          DEEPSEEK_API_KEY: test-only
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="localhost/deepseek-harness:${RELEASE_VERSION}"
          container="dsh-image-${RELEASE_ARCH}-${GITHUB_RUN_ID}"
          project="dsh-compose-${GITHUB_RUN_ID}"
          compose_file="dist/container/extracted/birdcoder-container-${RELEASE_VERSION}/docker-compose.yml"
          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm --force "$container" >/dev/null 2>&1 || true
            if [[ "$RELEASE_ARCH" == amd64 ]]; then
              docker compose --project-name "$project" --file "$compose_file" logs --no-color 2>&1 || true
              docker compose --project-name "$project" --file "$compose_file" down --volumes --remove-orphans >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          docker run --detach --name "$container" "$image"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            [[ "$status" == healthy ]] && break
            [[ "$status" == unhealthy ]] && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          docker rm --force "$container"
          if [[ "$RELEASE_ARCH" == amd64 ]]; then
            docker compose --project-name "$project" --file "$compose_file" up --detach --wait --wait-timeout 120
            curl --fail --show-error --silent http://127.0.0.1:4080/ >/dev/null
            docker compose --project-name "$project" --file "$compose_file" exec --no-TTY dsh \
              sh -c 'printf release-data > /data/.release-smoke-marker && printf release-workspace > /workspace/.release-smoke-marker'
            docker compose --project-name "$project" --file "$compose_file" up --detach --force-recreate --wait --wait-timeout 120
            docker compose --project-name "$project" --file "$compose_file" exec --no-TTY dsh \
              sh -c 'test "$(cat /data/.release-smoke-marker)" = release-data && test "$(cat /workspace/.release-smoke-marker)" = release-workspace'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: birdcoder-container-image-${{ needs.resolve.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            dist/container/birdcoder-container-image-${{ needs.resolve.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/container/birdcoder-container-image-${{ needs.resolve.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish one verified GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/birdcoder-v')
    needs: [resolve, desktop, container-bundle, container-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: dsh-github-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-*
          path: artifacts

      - name: Assemble and verify exact release assets
        run: pnpm exec tsx scripts/release/assemble-github-release.ts --input artifacts --output release-assets --version ${{ needs.resolve.outputs.version }}

      - name: Prepare retry-safe release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | [.id, .draft] | @tsv')"
          if [[ -z "$existing" ]]; then
            echo 'already-published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$existing" == *$'\n'* ]]; then
            echo "multiple releases exist for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          read -r release_id release_draft <<< "$existing"
          if [[ "$release_draft" != 'true' ]]; then
            echo 'already-published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          echo 'already-published=false' >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.release-state.outputs.already-published != 'true'
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          make_latest: false

      - name: Verify exact release assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          remote="$(mktemp)"
          release_pages="$(mktemp)"
          selection="$(mktemp)"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_pages"
          pnpm exec tsx scripts/release/select-github-latest.ts \
            --current-tag "$GITHUB_REF_NAME" < "$release_pages" > "$selection"
          release_id="$(jq --raw-output '.currentReleaseId' "$selection")"
          highest_tag="$(jq --raw-output '.highestTag' "$selection")"
          make_latest="$(jq --raw-output '.makeLatest' "$selection")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          test -n "$highest_tag"
          [[ "$make_latest" == true || "$make_latest" == false ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq '.assets[] | [.name, .size, .id, .digest] | @tsv' | sort > "$remote"
          cut -f1 "$remote" > "$actual"
          diff --unified "$expected" "$actual"
          test "$(wc -l < "$actual")" -eq 31
          while IFS= read -r name; do
            local_size="$(stat --format=%s "release-assets/${name}")"
            remote_size="$(awk -F '\t' -v name="$name" '$1 == name { print $2 }' "$remote")"
            test -n "$remote_size" && test "$local_size" -eq "$remote_size"
            if [[ "$name" == SHA256SUMS ]]; then
              expected_digest="$(sha256sum "release-assets/${name}" | cut -d ' ' -f1)"
            else
              expected_digest="$(awk -v name="$name" '$2 == name { print $1 }' release-assets/SHA256SUMS)"
            fi
            remote_digest="$(awk -F '\t' -v name="$name" '$1 == name { print $4 }' "$remote")"
            test -n "$expected_digest" && test "$remote_digest" = "sha256:${expected_digest}"
          done < "$expected"
          for metadata in SHA256SUMS latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            asset_id="$(awk -F '\t' -v name="$metadata" '$1 == name { print $3 }' "$remote")"
            test -n "$asset_id"
            downloaded="$(mktemp)"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$downloaded"
            cmp "release-assets/${metadata}" "$downloaded"
          done
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest="$make_latest" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')" = 'false'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.prerelease')" = 'false'
          latest_tag=''
          for attempt in {1..5}; do
            if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" \
              && [[ "$latest_tag" == "$highest_tag" ]]; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "GitHub Latest is ${latest_tag:-unavailable}; expected ${highest_tag}" >&2
              exit 1
            fi
            sleep 2
          done
