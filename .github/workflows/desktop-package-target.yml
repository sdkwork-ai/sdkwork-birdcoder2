# One native Desktop packaging lane. `desktop-release.yml` calls this workflow
# once per target, so every target is its own job: a failure names the target
# that produced it, "re-run failed jobs" retries that target alone, and the
# target table lives in the caller where coverage is reviewed ([lane
# decision](../../.agents/notes/implemented/process/2026-11-02-desktop-release-per-target-lanes.md)).
#
# Every target runs through `scripts/package-target.ts`, which builds the
# workspace, packs the dsh and vendor release families, materializes the bundled
# runtime, and only then invokes electron-builder. That keeps the artifact a
# runner uploads identical to what `scripts/release/assemble-github-release.ts`
# validates, and it is why this workflow never calls electron-builder directly.
#
# All six targets are packaged with `--unsigned`: the fork has no code-signing,
# notarization, or COS credential on any runner, and the release publishes
# unsigned installers by design.
name: Desktop package target

on:
  workflow_call:
    inputs:
      target:
        description: Packaging target name from `desktop-build-paths.mjs`; the job name
        required: true
        type: string
      runner:
        description: Runner label whose platform and architecture can execute the packaged runtime
        required: true
        type: string
      artifact:
        description: Actions artifact name that `assemble-github-release.ts` reads
        required: true
        type: string
      script:
        description: Desktop package script that builds this target
        required: true
        type: string
      build-root:
        description: Absolute Desktop build root; blank keeps the checkout default
        required: false
        type: string
        default: ''
      artifacts-dir:
        description: Directory this target writes its installers to
        required: true
        type: string
      env-file:
        description: Platform release settings file the win/mac preflight reads; blank skips it
        required: false
        type: string
        default: ''
      version:
        description: Version that this Desktop package must carry
        required: true
        type: string
    secrets:
      # This lane clones the pinned SDKWork siblings before packaging. A
      # reusable workflow receives no secrets unless the caller names them, so
      # the contract is declared here instead of being left to `inherit`.
      SDKWORK_GITHUB_TOKEN:
        description: GitHub token with read access to every sdkwork-* repository.
        required: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # The desktop shell's application identity. Packaging fails without it, and
  # electron-builder names the bundled application from it.
  DSH_DESKTOP_APP_ID: com.sdkwork.birdcoder
  # The linux lane has no platform dotenv — its packaging preflight is skipped —
  # so the electron-builder policy embed reads its mandatory-update origin from
  # the environment. The win/mac dotenv lanes never read ambient values.
  DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN: https://harness-test.deepseek.com
  # The test-deployment policy requires the approved login-document origins
  # (see apps/desktop/packaging/windows.env.example); production would reject the field.
  DSH_DESKTOP_MANDATORY_UPDATE_CONFIG: '{"allowedAuthOrigins":["https://login.example.com"]}'
  # The Web frontend builds the `cloud` deployment profile, which is also the
  # build default; stating it keeps a future default change from silently
  # switching the release to another deployment.
  DSH_WEB_DEPLOYMENT_PROFILE: cloud
  # This lane builds the Web frontend with Vite's `production` mode, so
  # `apps/web/vite.config.ts` reads the committed `.env.cloud.production` and
  # bakes the SDKWork cloud edge (`https://api.sdkwork.com`) and
  # `SDKWORK_ACCESS_TOKEN` into the page the installed application loads. There
  # is no packaging-time projection and no `resources/sdkwork-release.env`: the
  # environment is selected by the build mode, exactly like any other Vite
  # application. Refreshing the credential means editing that file, committing
  # it, and re-running this lane.

jobs:
  package:
    name: Package ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Clone SDKWork ecosystem siblings
        uses: ./.github/actions/setup-sdkwork-siblings
        with:
          token: ${{ secrets.SDKWORK_GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # A retried lane re-downloads the Electron distribution and the primary
      # runtime payload — Node, pnpm and the Python wheels — on every attempt
      # otherwise. Version-keyed restore keys let an older bundle satisfy the
      # parts this run names and download only the rest. These payloads live
      # outside the checkout, so the cache can restore them without moving the
      # Windows short build roots; the `runner` context is not available in
      # job-level `env`, so the path is spelled out here.
      - name: Restore cached downloads
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/dsh-desktop-package-cache
          key: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            desktop-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate package version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./package.json').version")"
          if [[ -n "$EXPECTED_VERSION" && "$EXPECTED_VERSION" != "$manifest_version" ]]; then
            echo "desktop version $manifest_version does not match requested version $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `scripts/package-target.ts` statically imports the notarization proxy,
      # which loads `@deepseek-ai/node-addon-system/flock` — a lib artifact of
      # this package that a fresh checkout does not have. Build it once so the
      # static import resolves on every runner before any packaging step runs.
      - name: Build the native entry package
        run: pnpm --dir native/system/packages/entry build:js

      # The Linux runtime carries `@deepseek-ai/node-addon-system-linux-<arch>`,
      # whose Landlock launcher and musl flock addon are compiled here from the
      # pinned sources: the launcher is a static musl executable and the musl
      # addon is a second copy, so both need `musl-gcc` beside the runner's `cc`.
      # The RPM artifact also needs `rpmbuild`, which electron-builder shells out
      # to through fpm, and the compressor that target pipes through.
      - name: Install the native system toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends musl-tools rpm xz-utils

      - name: Write the platform release settings for the unsigned lane
        if: inputs.env-file != ''
        shell: bash
        run: |
          cat >> "apps/desktop/${{ inputs.env-file }}" <<'SETTINGS'
          DSH_DESKTOP_APP_ID=com.sdkwork.birdcoder
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.com"]}
          SETTINGS
          if [[ "${{ inputs.env-file }}" == packaging/windows.env ]]; then
            cat >> "apps/desktop/${{ inputs.env-file }}" <<'SETTINGS'
          DSH_DESKTOP_WINDOWS_CER_FILE=
          DSH_DESKTOP_WINDOWS_SIGNTOOL=
          DSH_DESKTOP_WINDOWS_KEY_CONTAINER=
          DSH_DESKTOP_WINDOWS_TOKEN_PIN=
          SETTINGS
          else
            cat >> "apps/desktop/${{ inputs.env-file }}" <<'SETTINGS'
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY=
          DSH_DESKTOP_MACOS_TEAM_ID=
          SETTINGS
          fi

      - name: Package ${{ inputs.target }}
        # macOS runners have 7 GB RAM; the workspace build parallelizes across
        # many project compactions and exceeds the default Node heap. Cap the
        # heap at 6 GB so the build fits alongside the packaging subprocesses,
        # while Linux/Windows keep the full default (they have headroom).
        env:
          NODE_OPTIONS: ${{ runner.os == 'macOS' && '--max-old-space-size=6144' || '' }}
          # Blank on the four targets that do not need a short root; the build path
          # resolution reads a blank value as "use the checkout default".
          DSH_DESKTOP_BUILD_ROOT: ${{ inputs.build-root }}
          # The same directory the restore step caches, so a retried lane finds the
          # Electron distribution, the Node/pnpm runtime payload and the Python
          # wheels instead of downloading them again. It has to stay a step value:
          # a job-level `env` cannot read the `runner` context.
          DSH_DESKTOP_PACKAGE_CACHE_DIR: ${{ runner.temp }}/dsh-desktop-package-cache
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ inputs.script }}

      # electron-builder writes the unpacked application tree beside the
      # installers, and the release assembly accepts only the installers and
      # their metadata. Staging verifies the target against that contract on the
      # runner that built it, so a wrong artifact fails here rather than after
      # the other targets have finished.
      - name: Stage the assets the release assembly accepts
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
          ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$EXPECTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./package.json').version")"
          fi
          pnpm exec tsx scripts/release/stage-desktop-artifacts.ts \
            --artifact "$ARTIFACT" \
            --source "$ARTIFACTS_DIR" \
            --output staged-desktop \
            --version "$version"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact }}
          path: staged-desktop
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
