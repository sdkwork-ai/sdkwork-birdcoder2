# Clone immutable SDKWork repository inputs beside the project checkout. The
# committed source manifest is the only pin authority; local and CI workspace
# layouts therefore resolve the same ../sdkwork-* members.
name: Setup SDKWork ecosystem siblings

description: >-
  Clone the sdkwork-* repositories beside the project checkout at the commits
  recorded in scripts/sdkwork-sources.manifest.json.

inputs:
  token:
    description: GitHub token with read access to every sdkwork-* repository.
    required: true
  target-dir:
    description: >-
      Directory that must contain the sibling clones; defaults to the checkout
      parent (dirname of $GITHUB_WORKSPACE).
    required: false

runs:
  using: composite
  steps:
    - name: Clone SDKWork ecosystem siblings
      shell: bash
      env:
        SDKWORK_TOKEN: ${{ inputs.token }}
        SDKWORK_TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -euo pipefail
        if [[ -z "$SDKWORK_TOKEN" ]]; then
          echo 'setup-sdkwork-siblings: token is required to fetch pinned SDKWork repositories' >&2
          exit 1
        fi

        manifest="$GITHUB_ACTION_PATH/../../../scripts/sdkwork-sources.manifest.json"
        target_dir="${SDKWORK_TARGET_DIR:-$(dirname "$GITHUB_WORKSPACE")}"
        manifest_rows="$(node --input-type=module - "$manifest" <<'NODE'
        import { readFileSync } from 'node:fs'

        const path = process.argv[2]
        const manifest = JSON.parse(readFileSync(path, 'utf8'))
        if (manifest?.version !== 1 || !Array.isArray(manifest.repositories) || manifest.repositories.length === 0) {
          throw new Error(`${path}: expected version 1 and a non-empty repositories array`)
        }
        const names = new Set()
        for (const repository of manifest.repositories) {
          if (repository === null || typeof repository !== 'object'
            || typeof repository.name !== 'string'
            || typeof repository.url !== 'string'
            || typeof repository.commit !== 'string') {
            throw new Error(`${path}: every repository requires string name, url, and commit fields`)
          }
          if (!/^sdkwork-[a-z0-9-]+$/.test(repository.name) || names.has(repository.name)) {
            throw new Error(`${path}: invalid or duplicate repository name ${JSON.stringify(repository.name)}`)
          }
          const expectedUrl = `https://github.com/sdkwork-ai/${repository.name}.git`
          if (repository.url !== expectedUrl) {
            throw new Error(`${path}: ${repository.name} URL must be ${expectedUrl}`)
          }
          if (!/^[0-9a-f]{40}$/.test(repository.commit)) {
            throw new Error(`${path}: ${repository.name} commit must be a full lowercase SHA`)
          }
          names.add(repository.name)
          console.log(`${repository.name}\t${repository.url}\t${repository.commit}`)
        }
        NODE
        )"

        mkdir -p "$target_dir"
        auth_value="$(printf 'x-access-token:%s' "$SDKWORK_TOKEN" | base64 | tr -d '\r\n')"
        printf '::add-mask::%s\n' "$auth_value"
        auth_header="AUTHORIZATION: basic $auth_value"

        normalize_url() {
          local value="$1"
          if [[ "$value" == git@github.com:* ]]; then
            value="${value#git@github.com:}"
          else
            value="${value#*://}"
            value="${value#*@}"
            value="${value#github.com/}"
          fi
          value="${value%.git}"
          printf '%s' "$value"
        }

        while IFS=$'\t' read -r repo url commit; do
          dest="$target_dir/$repo"
          if [[ -e "$dest" ]]; then
            if [[ ! -d "$dest/.git" ]]; then
              echo "setup-sdkwork-siblings: $dest exists but is not a Git checkout" >&2
              exit 1
            fi
            # Windows runners enforce MAX_PATH for checkout; siblings carry
            # generated Java sources and docs with >260-char paths.
            git -C "$dest" config core.longpaths true
            actual_url="$(git -C "$dest" remote get-url origin)"
            if [[ "$(normalize_url "$actual_url")" != "$(normalize_url "$url")" ]]; then
              echo "setup-sdkwork-siblings: $repo origin does not match its pinned repository" >&2
              exit 1
            fi
            git -C "$dest" remote set-url origin "$url"
            actual_commit="$(git -C "$dest" rev-parse HEAD)"
            if [[ "$actual_commit" != "$commit" ]]; then
              echo "setup-sdkwork-siblings: $repo HEAD $actual_commit does not match $commit" >&2
              exit 1
            fi
            if [[ -n "$(git -C "$dest" status --porcelain --ignored)" ]]; then
              echo "setup-sdkwork-siblings: $repo has uncommitted, untracked, or ignored files" >&2
              exit 1
            fi
          else
            checkout="$(mktemp -d "$target_dir/.${repo}.XXXXXX")"
            # core.longpaths is per-repository config; set it before the first
            # checkout so Windows runners can materialize >260-char paths.
            if ! git init -q "$checkout" \
              || ! git -C "$checkout" config core.longpaths true \
              || ! git -C "$checkout" remote add origin "$url" \
              || ! git -c "http.https://github.com/.extraheader=$auth_header" -C "$checkout" fetch -q --depth 1 origin "$commit" \
              || ! git -C "$checkout" checkout -q --detach FETCH_HEAD; then
              rm -rf "$checkout"
              exit 1
            fi
            mv "$checkout" "$dest"
          fi
          echo "sdkwork sibling $repo @ ${commit:0:12}"
        done <<< "$manifest_rows"
